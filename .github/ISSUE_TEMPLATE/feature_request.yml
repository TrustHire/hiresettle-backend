name: Feature Request
description: Propose a new feature or enhancement for hiresettle-backend
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context / Problem Statement
      description: What problem does this feature solve or what capability is missing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution / Tasks
      description: Describe the API endpoints, data models, or behavior you'd like to see.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: How will we know this feature is complete?
