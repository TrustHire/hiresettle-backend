name: Bug report
description: Report something that is not working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      render: shell
  - type: input
    id: version
    attributes:
      label: Version / commit
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node version, OS, database, network (e.g. Stellar testnet)
